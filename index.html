<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>門市展示系統</title>
    <!-- 載入核心框架與樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 僅載入 React 版的 Lucide 圖標庫，避免全域變數衝突 -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            background-color: #020617; 
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        /* 圖片過場動畫 */
        .fade-transition {
            transition: background-image 0.8s ease-in-out, opacity 0.5s ease;
        }
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (function() {
            const { useState, useEffect, useCallback, useRef } = React;

            const App = () => {
                // 獲取 Lucide 圖標組件
                const Lucide = window.LucideReact;
                
                // 狀態初始化
                const [currentTab, setCurrentTab] = useState('home');
                const [config, setConfig] = useState({
                    imageUrls: JSON.parse(localStorage.getItem('kiosk_images')) || [
                        'https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=1000&q=80',
                        'https://images.unsplash.com/photo-1552733407-5d5c46c3bb3b?auto=format&fit=crop&w=1000&q=80'
                    ],
                    surveyUrl: localStorage.getItem('kiosk_survey_url') || '',
                    storeName: localStorage.getItem('kiosk_store_name') || '門市展示中心'
                });
                
                const [currentIndex, setCurrentIndex] = useState(0);
                const [toast, setToast] = useState(null);
                const inactivityTimer = useRef(null);

                // --- 1. 自動輪播邏輯 (5秒切換) ---
                useEffect(() => {
                    let interval = null;
                    if (currentTab === 'home' && config.imageUrls.length > 1) {
                        interval = setInterval(() => {
                            setCurrentIndex((prev) => (prev === config.imageUrls.length - 1 ? 0 : prev + 1));
                        }, 5000);
                    }
                    return () => { if (interval) clearInterval(interval); };
                }, [currentTab, config.imageUrls]);

                // --- 2. 閒置偵測 (60秒無操作返回首頁) ---
                const resetInactivityTimer = useCallback(() => {
                    if (inactivityTimer.current) clearTimeout(inactivityTimer.current);
                    if (currentTab !== 'home') {
                        inactivityTimer.current = setTimeout(() => {
                            setCurrentTab('home');
                            setCurrentIndex(0);
                            setToast("🔄 系統已自動返回展示畫面");
                        }, 60000);
                    }
                }, [currentTab]);

                useEffect(() => {
                    const handleUserActivity = () => resetInactivityTimer();
                    const activityEvents = ['touchstart', 'mousedown', 'scroll', 'keydown'];
                    
                    activityEvents.forEach(e => window.addEventListener(e, handleUserActivity));
                    resetInactivityTimer();
                    
                    return () => {
                        activityEvents.forEach(e => window.removeEventListener(e, handleUserActivity));
                        if (inactivityTimer.current) clearTimeout(inactivityTimer.current);
                    };
                }, [resetInactivityTimer]);

                // --- 3. 系統工具 ---
                useEffect(() => {
                    if (toast) {
                        const t = setTimeout(() => setToast(null), 3000);
                        return () => clearTimeout(t);
                    }
                }, [toast]);

                const saveSettings = (newConfig) => {
                    localStorage.setItem('kiosk_images', JSON.stringify(newConfig.imageUrls));
                    localStorage.setItem('kiosk_survey_url', newConfig.surveyUrl);
                    localStorage.setItem('kiosk_store_name', newConfig.storeName);
                    setConfig(newConfig);
                    setToast("✅ 設定已成功儲存");
                    setCurrentTab('home');
                };

                // 安全檢查圖標庫
                if (!Lucide) {
                    return <div className="h-screen w-screen flex items-center justify-center text-white bg-slate-900 font-bold tracking-widest animate-pulse">系統初始化中...</div>;
                }

                const { 
                    Settings, Image, MessageSquare, RefreshCw, 
                    ChevronLeft, ChevronRight, Save, Plus, Trash2 
                } = Lucide;

                return (
                    <div className="flex h-screen w-screen bg-slate-950 overflow-hidden text-slate-800 flex-col font-sans select-none">
                        <main className="flex-1 relative overflow-hidden flex flex-col">
                            
                            {/* 展示模式 */}
                            {currentTab === 'home' && (
                                <div className="relative h-full w-full bg-black flex flex-col animate-in fade-in duration-500">
                                    {config.imageUrls.length > 0 ? (
                                        <>
                                            <div 
                                                className="flex-1 w-full bg-cover bg-center bg-no-repeat fade-transition"
                                                style={{ backgroundImage: `url(${config.imageUrls[currentIndex]})` }} 
                                            />
                                            <div className="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-black/70 to-transparent pointer-events-none" />
                                            
                                            <button onClick={() => setCurrentIndex(prev => prev === 0 ? config.imageUrls.length - 1 : prev - 1)} className="absolute left-6 top-1/2 -translate-y-1/2 w-14 h-14 bg-black/30 backdrop-blur-md text-white rounded-full flex items-center justify-center active:scale-90 z-10 border border-white/10 shadow-lg">
                                                <ChevronLeft size={32}/>
                                            </button>
                                            <button onClick={() => setCurrentIndex(prev => prev === config.imageUrls.length - 1 ? 0 : prev + 1)} className="absolute right-6 top-1/2 -translate-y-1/2 w-14 h-14 bg-black/30 backdrop-blur-md text-white rounded-full flex items-center justify-center active:scale-90 z-10 border border-white/10 shadow-lg">
                                                <ChevronRight size={32}/>
                                            </button>

                                            <div className="absolute bottom-10 left-0 w-full flex justify-center space-x-2.5">
                                                {config.imageUrls.map((_, idx) => (
                                                    <div key={idx} className={`h-1.5 rounded-full transition-all duration-500 ${idx === currentIndex ? 'w-10 bg-white shadow-[0_0_15px_rgba(255,255,255,0.8)]' : 'w-2 bg-white/30'}`} />
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <div className="text-white flex flex-col items-center justify-center h-full space-y-4 opacity-50">
                                            <Image size={64} />
                                            <p className="text-xl">請至設定頁面添加照片網址</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* 問卷模式 */}
                            {currentTab === 'survey' && (
                                <div className="h-full flex flex-col bg-white animate-in slide-in-from-right duration-500">
                                    <div className="flex-1">
                                        {config.surveyUrl ? (
                                            <iframe src={config.surveyUrl} className="w-full h-full border-none" title="Survey" />
                                        ) : (
                                            <div className="h-full flex flex-col items-center justify-center text-slate-300 bg-slate-50">
                                                <MessageSquare size={100} className="mb-6 opacity-20" />
                                                <p className="text-xl font-bold">尚未設定問卷連結</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* 設定模式 */}
                            {currentTab === 'settings' && (
                                <div className="h-full bg-slate-50 p-6 overflow-y-auto animate-in fade-in duration-300 no-scrollbar">
                                    <div className="max-w-xl mx-auto pb-12">
                                        <div className="flex items-center justify-between mb-8">
                                            <h2 className="text-3xl font-black text-slate-900 tracking-tight">系統後台設定</h2>
                                            <button onClick={() => setCurrentTab('home')} className="p-3 bg-white rounded-2xl shadow-sm text-slate-400">
                                                <ChevronLeft size={28} />
                                            </button>
                                        </div>
                                        <div className="bg-white rounded-[2rem] p-8 shadow-xl border border-slate-200/50 space-y-8">
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 mb-3 tracking-widest uppercase">門市名稱</label>
                                                <input type="text" value={config.storeName} onChange={(e) => setConfig({...config, storeName: e.target.value})} className="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-100 transition-all" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 mb-3 tracking-widest uppercase text-center">展示照片連結 (直式)</label>
                                                <div className="space-y-3">
                                                    {config.imageUrls.map((url, idx) => (
                                                        <div key={idx} className="flex space-x-2">
                                                            <input type="text" value={url} onChange={(e) => { const newUrls = [...config.imageUrls]; newUrls[idx] = e.target.value; setConfig({...config, imageUrls: newUrls}); }} className="flex-1 p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="https://..." />
                                                            <button onClick={() => setConfig({...config, imageUrls: config.imageUrls.filter((_, i) => i !== idx)})} className="p-4 bg-red-50 text-red-400 rounded-xl active:scale-95 transition-all"><Trash2 size={20}/></button>
                                                        </div>
                                                    ))}
                                                    <button onClick={() => setConfig({...config, imageUrls: [...config.imageUrls, '']})} className="w-full py-5 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 hover:text-blue-500 hover:border-blue-200 active:bg-slate-50 transition-all font-bold">+ 新增一張圖片</button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 mb-3 tracking-widest uppercase">問卷連結 (Google Forms)</label>
                                                <input type="text" value={config.surveyUrl} onChange={(e) => setConfig({...config, surveyUrl: e.target.value})} className="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-100 transition-all" placeholder="https://forms.gle/..." />
                                            </div>
                                            <button onClick={() => saveSettings(config)} className="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all flex items-center justify-center space-x-2">
                                                <Save size={24} />
                                                <span>儲存設定並套用</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        {/* 底部導覽列 */}
                        <footer className="h-32 bg-white border-t border-slate-100 flex items-center px-6 z-40 pb-safe shadow-[0_-15px_50px_rgba(0,0,0,0.06)]">
                            <button onClick={() => setCurrentTab('settings')} className={`p-4 rounded-2xl transition-all ${currentTab === 'settings' ? 'text-blue-600 bg-blue-50' : 'text-slate-200 hover:text-slate-400'}`}>
                                <Settings size={32}/>
                            </button>
                            <div className="flex-1 flex justify-center space-x-4 mx-2">
                                <button onClick={() => { setCurrentTab('home'); setCurrentIndex(0); }} className={`flex-none w-32 py-5 rounded-3xl flex flex-col items-center transition-all ${currentTab === 'home' ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-50 text-slate-400'}`}>
                                    <Image size={24}/>
                                    <span className="font-bold text-[10px] mt-1 uppercase tracking-widest">展示模式</span>
                                </button>
                                <button onClick={() => setCurrentTab('survey')} className={`flex-1 max-w-[300px] py-5 rounded-3xl flex flex-col items-center transition-all ${currentTab === 'survey' ? 'bg-orange-500 text-white shadow-xl shadow-orange-200' : 'bg-orange-50 text-orange-600 border border-orange-100'}`}>
                                    <div className="flex items-center space-x-2">
                                        <MessageSquare size={28}/>
                                        <span className="font-black text-xl tracking-tighter">服務滿意度評分</span>
                                    </div>
                                    <span className="text-[10px] font-bold mt-1 opacity-70">TAP TO START</span>
                                </button>
                            </div>
                            <button onClick={() => window.location.reload()} className="p-4 text-slate-200 hover:text-slate-400 transition-colors">
                                <RefreshCw size={28}/>
                            </button>
                        </footer>

                        {/* Toast 提示 */}
                        {toast && (
                            <div className="fixed top-1/2 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-md text-white px-8 py-5 rounded-[2rem] font-bold text-lg shadow-2xl z-[100] animate-in fade-in zoom-in duration-300 border border-white/10">
                                {toast}
                            </div>
                        )}
                    </div>
                );
            };

            // 確保掛載
            const container = document.getElementById('root');
            if (container) {
                const root = ReactDOM.createRoot(container);
                root.render(<App />);
            }
        })();
    </script>
</body>
</html>
